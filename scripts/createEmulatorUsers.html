<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Create Emulator Test Users</title>
  <style>
    body { font-family: system-ui; max-width: 800px; margin: 50px auto; padding: 20px; background: #1a1a1a; color: #fff; }
    button { background: #4285f4; color: white; border: none; padding: 12px 24px; border-radius: 4px; cursor: pointer; margin: 10px 0; }
    #output { background: #2d2d2d; padding: 20px; border-radius: 4px; font-family: monospace; font-size: 14px; margin-top: 20px; }
    .success { color: #34a853; }
    .error { color: #ea4335; }
    input { background: #2d2d2d; color: #fff; border: 1px solid #666; padding: 8px; margin: 5px 0; width: 100%; }
  </style>
</head>
<body>
  <h1>👤 Create Emulator Test Users</h1>
  <p>Get emails from Firestore participants and create matching Auth users</p>
  <button id="autoCreateBtn">Auto-Create Users from Participants</button>
  <pre id="output"></pre>

  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
    import { getAuth, createUserWithEmailAndPassword, connectAuthEmulator } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js';
    import { getFirestore, collection, getDocs, doc, setDoc, deleteDoc, connectFirestoreEmulator } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js';

    const firebaseConfig = {
      apiKey: 'AIzaSyAi6xTXieeklm2ehtWU7MxEqtL4FP5pzno',
      authDomain: 'fantacalcio-rigori.firebaseapp.com',
      projectId: 'fantacalcio-rigori',
      storageBucket: 'fantacalcio-rigori.appspot.com',
      messagingSenderId: '1029812597058',
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    
    connectAuthEmulator(auth, 'http://127.0.0.1:9099');
    connectFirestoreEmulator(db, '127.0.0.1', 8080);

    const output = document.getElementById('output');
    const log = (msg, type = 'info') => {
      const line = document.createElement('div');
      line.className = type;
      line.textContent = msg;
      output.appendChild(line);
    };

    document.getElementById('autoCreateBtn').addEventListener('click', async () => {
      output.innerHTML = '';
      log('🔍 Reading participants from Firestore...', 'info');

      try {
        const participantsSnap = await getDocs(collection(db, 'participants'));
        const participants = participantsSnap.docs.map(d => ({ oldId: d.id, ...d.data() }));
        
        log(`Found ${participants.length} participants\n`, 'success');

        for (const participant of participants) {
          const email = participant.email;
          if (!email) {
            log(`⚠️ Skipping participant ${participant.oldId} (no email)`, 'error');
            continue;
          }

          try {
            log(`\n📧 Creating user: ${email}`, 'info');
            const credential = await createUserWithEmailAndPassword(auth, email, 'password123');
            const authUID = credential.user.uid;
            log(`   ✅ Auth UID: ${authUID}`, 'success');

            // Create new participant doc with Auth UID as ID
            const { oldId, email: _, ...data } = participant;
            await setDoc(doc(db, 'participants', authUID), { email, ...data });
            log(`   ✅ Created participants/${authUID}`, 'success');

            // Delete old participant doc
            await deleteDoc(doc(db, 'participants', oldId));
            log(`   🗑️ Deleted old participants/${oldId}`, 'info');

          } catch (error) {
            if (error.code === 'auth/email-already-exists') {
              log(`   ⚠️ ${email} already exists`, 'error');
            } else {
              log(`   ❌ Error: ${error.message}`, 'error');
            }
          }
        }

        log('\n🎉 Done! Auth users created and participants updated', 'success');
        log('\nDefault password for all users: password123', 'info');
        
      } catch (error) {
        log(`❌ Error: ${error.message}`, 'error');
      }
    });

    log('✅ Ready! Click button to auto-create users from participants.', 'info');
  </script>
</body>
</html>
