<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>List Participants</title>
  <style>
    body { font-family: system-ui; max-width: 900px; margin: 50px auto; padding: 20px; background: #1a1a1a; color: #fff; }
    button { background: #4285f4; color: white; border: none; padding: 12px 24px; border-radius: 4px; cursor: pointer; }
    select { background: #2d2d2d; color: #fff; padding: 10px; border: 1px solid #666; margin: 10px 0; }
    #output { background: #2d2d2d; padding: 20px; border-radius: 4px; font-family: monospace; font-size: 14px; margin-top: 20px; max-height: 600px; overflow-y: auto; }
    .participant { border: 1px solid #666; padding: 10px; margin: 10px 0; border-radius: 4px; }
    .id { color: #4285f4; font-weight: bold; }
    .email { color: #34a853; }
    .copy-btn { background: #666; padding: 5px 10px; font-size: 12px; margin-left: 10px; cursor: pointer; border-radius: 3px; border: none; color: white; }
    .warning { background: #fbbc04; color: #000; padding: 15px; border-radius: 8px; margin: 20px 0; }
  </style>
</head>
<body>
  <h1>📋 List All Participants</h1>
  
  <div class="warning">
    <strong>⚠️ Environment Selection:</strong><br>
    Open the page with URL parameter to select environment:<br>
    • Emulator: <a href="?env=emulator" style="color: #000;">?env=emulator</a><br>
    • Production: <a href="?env=production" style="color: #000;">?env=production</a>
  </div>

  <div>
    <label>Current Environment: <strong id="currentEnv"></strong></label>
  </div>

  <button id="listBtn">List Participants</button>
  
  <div id="output"></div>

  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
    import { getFirestore, collection, getDocs, connectFirestoreEmulator } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js';

    const firebaseConfig = {
      apiKey: 'AIzaSyAi6xTXieeklm2ehtWU7MxEqtL4FP5pzno',
      authDomain: 'fantacalcio-rigori.firebaseapp.com',
      projectId: 'fantacalcio-rigori',
      storageBucket: 'fantacalcio-rigori.appspot.com',
      messagingSenderId: '1029812597058',
    };

    // Get environment from URL parameter
    const urlParams = new URLSearchParams(window.location.search);
    const environment = urlParams.get('env') || 'emulator';

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // Connect to emulator if specified
    if (environment === 'emulator') {
      connectFirestoreEmulator(db, '127.0.0.1', 8080);
      document.getElementById('currentEnv').textContent = '🔧 Emulator (localhost:8080)';
      document.getElementById('currentEnv').style.color = '#fbbc04';
    } else {
      document.getElementById('currentEnv').textContent = '🌐 Production';
      document.getElementById('currentEnv').style.color = '#34a853';
    }

    const output = document.getElementById('output');

    document.getElementById('listBtn').addEventListener('click', async () => {
      output.innerHTML = '<div style="color: #fbbc04;">🔍 Loading participants...</div>';

      try {
        const snapshot = await getDocs(collection(db, 'participants'));
        
        if (snapshot.empty) {
          output.innerHTML = '<div style="color: #ea4335;">❌ No participants found!</div>';
          return;
        }

        let html = `<div style="color: #34a853; margin-bottom: 20px;">✅ Found ${snapshot.size} participants</div>`;

        snapshot.docs.forEach(doc => {
          const data = doc.data();
          
          html += `
            <div class="participant">
              <div>
                <span class="id">ID: ${doc.id}</span>
                <button class="copy-btn" onclick="navigator.clipboard.writeText('${doc.id}'); alert('Copied ID: ${doc.id}')">Copy ID</button>
              </div>
              <div class="email">Email: ${data.email || 'N/A'}</div>
              <div>Name: ${data.name || 'N/A'}</div>
              <div style="color: #999; font-size: 12px; margin-top: 5px;">
                Fields: ${Object.keys(data).join(', ')}
              </div>
            </div>
          `;
        });

        output.innerHTML = html;

      } catch (error) {
        output.innerHTML = `<div style="color: #ea4335;">❌ Error: ${error.message}</div>`;
        console.error(error);
      }
    });
  </script>
</body>
</html>
