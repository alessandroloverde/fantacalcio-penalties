<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sync Firestore to Emulator</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      max-width: 800px;
      margin: 50px auto;
      padding: 20px;
      background: #1a1a1a;
      color: #fff;
    }
    h1 {
      color: #4285f4;
    }
    button {
      background: #4285f4;
      color: white;
      border: none;
      padding: 12px 24px;
      font-size: 16px;
      border-radius: 4px;
      cursor: pointer;
      margin: 20px 0;
    }
    button:hover {
      background: #357ae8;
    }
    button:disabled {
      background: #666;
      cursor: not-allowed;
    }
    #output {
      background: #2d2d2d;
      padding: 20px;
      border-radius: 4px;
      min-height: 200px;
      font-family: 'Courier New', monospace;
      font-size: 14px;
      line-height: 1.6;
      overflow-y: auto;
      max-height: 500px;
    }
    .success { color: #34a853; }
    .error { color: #ea4335; }
    .info { color: #fbbc04; }
  </style>
</head>
<body>
  <h1>🔄 Sync Firestore to Emulator</h1>
  <p>This will copy all data from your production Firestore to the local emulator.</p>
  <button id="syncBtn">Start Sync</button>
  <pre id="output"></pre>

  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
    import { getFirestore, collection, getDocs, doc, setDoc, connectFirestoreEmulator } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js';

    const firebaseConfig = {
      apiKey: 'AIzaSyAi6xTXieeklm2ehtWU7MxEqtL4FP5pzno',
      authDomain: 'fantacalcio-rigori.firebaseapp.com',
      projectId: 'fantacalcio-rigori',
      storageBucket: 'fantacalcio-rigori.appspot.com',
      messagingSenderId: '1029812597058',
      appId: '1:1029812597058:web:YOUR_APP_ID'
    };

    // Production DB
    const prodApp = initializeApp(firebaseConfig);
    const prodDb = getFirestore(prodApp);

    // Emulator DB
    const emulatorApp = initializeApp(firebaseConfig, 'emulator');
    const emulatorDb = getFirestore(emulatorApp);
    connectFirestoreEmulator(emulatorDb, '127.0.0.1', 8080);

    const output = document.getElementById('output');
    const syncBtn = document.getElementById('syncBtn');

    const log = (msg, type = 'info') => {
      const line = document.createElement('div');
      line.className = type;
      line.textContent = msg;
      output.appendChild(line);
      output.scrollTop = output.scrollHeight;
      console.log(msg);
    };

    syncBtn.addEventListener('click', async () => {
      syncBtn.disabled = true;
      output.innerHTML = '';
      
      try {
        log('🚀 Starting sync...', 'info');
        
        const collections = ['players', 'teams', 'gameSettings', 'participants'];
        let totalDocs = 0;
        
        for (const collName of collections) {
          log(`\n📦 Syncing collection: ${collName}`, 'info');
          
          try {
            const snapshot = await getDocs(collection(prodDb, collName));
            log(`   Found ${snapshot.size} documents`, 'info');
            
            for (const docSnap of snapshot.docs) {
              const data = docSnap.data();
              await setDoc(doc(emulatorDb, collName, docSnap.id), data);
              log(`   ✅ Synced: ${docSnap.id}`, 'success');
              totalDocs++;
            }
          } catch (err) {
            log(`   ⚠️ Error with collection ${collName}: ${err.message}`, 'error');
          }
        }
        
        log(`\n🎉 Sync complete! Total documents synced: ${totalDocs}`, 'success');
        log(`\n⚠️ Don't forget to revert your Firestore rules!`, 'info');
      } catch (error) {
        log(`\n❌ Error: ${error.message}`, 'error');
        console.error(error);
      } finally {
        syncBtn.disabled = false;
      }
    });

    log('✅ Ready to sync. Make sure your emulator is running on port 8080!', 'info');
  </script>
</body>
</html>
